<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BECHAND?!</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://unpkg.com/jalaali-js/dist/jalaali.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root { --bg: #343030; --card: #1d1d1f; --text: #fff; --border: rgba(255,255,255,0.06); --nav: rgba(35,35,35,0.92); --green: #00c853; --red: #ff5252; --modal-bg: rgba(28, 28, 30, 0.45); }
        #update-text { color: #ffffff !important; font-weight: 300 !important; letter-spacing: 0.5px; opacity: 0.8; }
        body.light-mode { --bg: #f2f2f7; --card: #ffffff; --text: #000; --border: rgba(0,0,0,0.1); --nav: rgba(255,255,255,0.9); --modal-bg: rgba(255, 255, 255, 0.45); }
        body { background: var(--bg); color: var(--text); font-family: 'Vazirmatn', sans-serif; overflow-x: hidden; -webkit-tap-highlight-color: transparent; margin: 0; }
        .header { padding: 8px 16px 12px; display: flex; flex-direction: row; justify-content: space-between; align-items: flex-start; background: var(--bg); position: sticky; top: 0; z-index: 1001; direction: ltr; }
        .brand-name { font-weight: 900; line-height: 1; font-size: 2.1rem; letter-spacing: -0.4px; text-align: left; margin: 0; margin-top: 4px; }
        .date-time { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; white-space: nowrap; }
        .date-time-row { display: flex; gap: 10px; align-items: center; }
        .container { padding: 10px 16px 80px; display: flex; flex-direction: column; gap: 9px; }
        .card { background: var(--card); backdrop-filter: blur(15px); border: 1px solid var(--border); box-shadow: 0 8px 25px rgba(0,0,0,0.08); border-radius: 20px; padding: 0; display: flex; flex-direction: column; transition: all 0.3s ease; cursor: pointer; overflow: hidden; }
        body.light-mode .card { background: #ffffff !important; border: 1px solid rgba(0,0,0,0.06); }
        .card-main-row { display: flex; justify-content: space-between; align-items: center; padding: 14px; width: 100%; box-sizing: border-box; }
        .card.active-up { border-left: 4px solid var(--green) !important; border-bottom: 2px solid var(--green) !important; }
        .card.active-down { border-left: 4px solid var(--red) !important; border-bottom: 2px solid var(--red) !important; }
        .grid-mode .card { aspect-ratio: 1 / 1; justify-content: center; }
        .grid-mode .card-main-row { flex-direction: column-reverse; text-align: center; padding: 10px; gap: 15px; justify-content: center; height: 100%; }
        .grid-mode .chart-wrapper, .grid-mode .drag-handle { display: none; }
    </style>
</head>
<body class="light-mode">
    <div class="header">
        <div class="header-left">
            <div class="brand-name">BECHAND?!</div>
        </div>
        <div class="date-time" id="dt"></div>
    </div>
    <div id="main-container" class="container grid-mode"></div>
    <div class="bottom-nav">
        <i class="fas fa-cog" style="cursor:pointer;" onclick="openModal('sMod')"></i>
        <span id="update-text" style="font-weight: 800; color: #d4af37;">لحظاتی پیش</span>
        <i class="fas fa-calculator" style="cursor:pointer;" onclick="openModal('calcMod')"></i>
        </div><div id="sMod" class="full-modal">
        <div style="display:flex; justify-content:space-between; align-items: center; margin-bottom: 20px;">
            <b id="settings-title" style="font-size: 1.2rem;">تنظیمات</b>
            <i class="fas fa-times" style="font-size: 1.3rem; cursor:pointer; opacity: 0.6;" onclick="closeModal('sMod')"></i>
        </div>
        <!-- (محتوای مودال‌ها همان کدهای قبلی است) -->
    </div>
    <div id="aboutMod" class="full-modal">...</div>
    <div id="calcMod" class="full-modal">...</div>
    <script>

</body>
